[project]
name = "volt-credit-decisioning"
version = "0.1.0"
description = "End-to-end credit decisioning ML platform — demo for Senior Data Scientist (fintech)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
