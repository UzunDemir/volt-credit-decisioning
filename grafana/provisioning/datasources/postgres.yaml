apiVersion: 1

datasources:
  - name: VoltPostgres
    uid: voltdb
    type: postgres
    access: proxy
    url: postgres:5432
    database: volt_credit
    user: volt
    secureJsonData:
      password: volt
    jsonData:
      database: volt_credit   # Grafana 13 reads db name from jsonData for the query editor
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
